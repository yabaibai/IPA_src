# ============================================================================
# GitHub Actions: 构建并输出【未签名 unsigned】IPA 包 (Expo + xcodebuild)
# 适用: SmartWhale (Expo managed) iOS 构建
# 说明:
#   - 用 GitHub macOS runner (自带 Xcode) 出未签名 IPA
#   - 未签名 IPA 不能直接装真机, 仅用于 CI 归档 / 后续用证书再签
#   - 证书不要入仓; 本流程不依赖 EXPO_TOKEN (EXPO_NO_LOGIN=1 离线 prebuild)
# ============================================================================

name: Build Unsigned IPA (iOS)

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'smartwhale_v1.1.19/**'
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NODE_VERSION: '20'
      SENTRY_DISABLE_AUTO_UPLOAD: '1'
      SENTRY_AUTH_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # iOS 源码已解包入仓, 直接定位源码目录
      - name: Set source dir
        run: |
          echo "SRC_DIR=smartwhale_v1.1.19" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies (no frozen lockfile; offline expo)
        working-directory: ${{ env.SRC_DIR }}
        env:
          EXPO_NO_LOGIN: "1"
          EXPO_OFFLINE: "1"
        run: |
          pnpm install --no-frozen-lockfile
          npm install -g expo-cli eas-cli

      - name: Expo prebuild (unsigned, offline, no login, use local expo)
        working-directory: ${{ env.SRC_DIR }}
        env:
          EXPO_NO_LOGIN: "1"
          CI: "1"
          EXPO_CACHE_DIR: "/tmp/expo-cache"
        run: |
          pnpm exec expo prebuild --platform ios --non-interactive

      - name: Verify ios project generated
        working-directory: ${{ env.SRC_DIR }}
        run: |
          ls -la ios/ || (echo "ios/ missing, prebuild failed"; exit 1)
          ls ios/*.xcworkspace || (echo "xcworkspace missing"; exit 1)

      - name: Strip Sentry dSYM upload phase (CI does not need it)
        working-directory: ${{ env.SRC_DIR }}
        run: |
          python3 scripts/strip_sentry.py

      - name: xcodebuild archive (CODE_SIGNING_ALLOWED=NO -> unsigned)
        working-directory: ${{ env.SRC_DIR }}
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: '1'
          SENTRY_AUTH_TOKEN: ''
        run: |
          xcodebuild -workspace ios/SmartWhale.xcworkspace \
            -scheme SmartWhale \
            -configuration Release \
            -archivePath build/SmartWhale.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            -destination 'generic/platform=iOS' \
            archive

      - name: Package unsigned IPA (no exportArchive, no signing/team needed)
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -e
          APP_PATH=$(find build/SmartWhale.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then echo 'app not found in xcarchive'; exit 1; fi
          echo "app: $APP_PATH"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          APP_IN_PAYLOAD=$(find build/ipa/Payload -maxdepth 1 -name '*.app' | head -1)
          # 关键: 清掉 Expo 预构建注入的 entitlements (aps-environment / application-groups /
          # keychain-access-groups 等), 这些会导致重签后 iOS 启动校验失败闪退。
          # 直连 Supabase 不依赖这些权限, 移除后全能签等工具可正常重签安装。
          if [ -f "$APP_IN_PAYLOAD/Entitlements.plist" ]; then
            rm -f "$APP_IN_PAYLOAD/Entitlements.plist"
            echo "removed Entitlements.plist"
          fi
          # 同时清掉可能残留的 embedded provisioning / 旧签名痕迹
          rm -f "$APP_IN_PAYLOAD/embedded.mobileprovision" 2>/dev/null || true
          rm -rf "$APP_IN_PAYLOAD/_CodeSignature" 2>/dev/null || true
          cd build/ipa
          # 未签名 IPA = Payload/<app>.app 直接 zip，不涉及任何签名/team
          zip -r -q SmartWhale-unsigned.ipa Payload
          cd -
          ls -lh build/ipa/SmartWhale-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartWhale-unsigned-ipa
          path: ${{ env.SRC_DIR }}/build/ipa/SmartWhale-unsigned.ipa
          retention-days: 30

# ============================================================================
# 使用说明:
#   1. 本文件位于 .github/workflows/build-unsigned-ipa.yml
#   2. 无需 EXPO_TOKEN: 已设 EXPO_NO_LOGIN=1 + --no-install 离线 prebuild
#   3. 触发: 手动 Actions 页 Run, 或 push 到 main 且 ios 源码目录变动
#   4. 产物: Actions > Artifacts > SmartWhale-unsigned-ipa (未签名 IPA)
# ============================================================================
